services:
  postgres:
    image: postgres:16-alpine
    container_name: relay-fuse-postgres-2026
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - relay_fuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relay']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: relay-fuse-redis-2026
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - relay_fuse_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  relay_fuse_postgres_data:
  relay_fuse_redis_data:
